spring:
  application:
    name: smart-job-application-tracker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobtracker}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000 # 1 day
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:dummy}
    api-key: ${CLOUDINARY_API_KEY:dummy}
    api-secret: ${CLOUDINARY_API_SECRET:dummy}

logging:
  level:
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

  web:
    resources:
      static-locations: classpath:/static/,file:./